packages:
  - "apps/*"
  - "packages/*"

allowBuilds:
  '@nestjs/core': true
  '@prisma/client': true
  '@prisma/engines': true
  argon2: true
  bufferutil: true
  es5-ext: true
  esbuild: true
  msgpackr-extract: true
  prisma: true
  sharp: true
  unrs-resolver: true
  utf-8-validate: true

overrides:
  ioredis: 5.10.1

onlyBuiltDependencies:
  - "@nestjs/core"
  - "@prisma/client"
  - "@prisma/engines"
  - argon2
  - bufferutil
  - es5-ext
  - esbuild
  - msgpackr-extract
  - prisma
  - sharp
  - unrs-resolver
  - utf-8-validate
